<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Note Draft</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <div class="top-bar">
        <h1>Note Draft</h1>
        <button type="button" id="theme-toggle">Dark mode</button>
      </div>
 
      <label for="note-text">Write your note (max 200 characters)</label>
      <textarea id="note-text" rows="6"></textarea>
 
      <div class="counters">
        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>
      </div>
 
      <button type="button" id="clear-btn">Clear</button>
    </main>
  </body>
</html>
