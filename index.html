<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes</title>
    
  </head>
  <body>
    <header>
        <h1>QuickNotes</h1>
        <p>Your simple note-taking app.</p>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
        </nav>
    </header>
 
    <main>
        <h2>How to use QuickNotes</h2>
        <ol>
            <li>Type a note in the box.</li>
            <li>Click “Add Note”.</li>
            <li>Your note appears below.</li>
        </ol>

        <ul>
          <li>Responsive design</li>
          <li>Simple note taking</li>
          <li>Clean user interface</li>
        </ul>       
        <form id="note-form">
            <label for="note-input">Add a new note:</label>
            <input type="text" id="note-input" placeholder="Type your note here">
            <button type="submit">Add Note</button>
        </form> 
        
 
    
    </main>
 
    <footer>
      <p>&copy; 2026 QuickNotes. Built during Web Foundations.</p>
    </footer>
  </body>
</html>
